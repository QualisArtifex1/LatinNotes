<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gather Text — LatinNotes</title>
  <link rel="stylesheet" href="./gather-text.css?v=20261117-gather-1">
  <script type="module" src="./gather-text-window.js?v=20261117-gather-1"></script>
</head>
<body>
  <header>
    <div class="heading"><h1>Gather Text</h1><a href="https://www.thelatinlibrary.com/" target="_blank" rel="noopener noreferrer">Open library separately ↗</a></div>
    <p>Browse below, highlight Latin and copy it (<span id="copy-shortcut">Ctrl+C</span>). Then add it to LatinNotes.</p>
    <div class="actions">
      <button id="add-copied" type="button" class="primary">Add copied text</button>
      <button id="paste-instead" type="button">Paste instead</button>
      <button id="library-home" type="button">Library home</button>
      <button id="return-to-app" type="button">Return to LatinNotes</button>
    </div>
    <p id="status" role="status" aria-live="polite"></p>
  </header>
  <iframe id="library" title="The Latin Library" src="https://www.thelatinlibrary.com/" referrerpolicy="no-referrer" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>
  <dialog id="paste-dialog" aria-labelledby="paste-title">
    <form id="paste-form">
      <h2 id="paste-title">Paste your Latin</h2>
      <p id="paste-help">Paste your copied passage below, then choose Add text.</p>
      <label for="latin-text">Latin passage</label>
      <textarea id="latin-text" rows="10" placeholder="Paste Latin here…"></textarea>
      <p id="paste-status" role="status"></p>
      <div class="actions"><button type="submit" class="primary">Add text</button><button id="cancel-paste" type="button">Cancel</button></div>
    </form>
  </dialog>
</body>
</html>
